server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /auth/ {
        proxy_pass http://backend:8000/auth/;
    }

    location /vendors/ {
        proxy_pass http://backend:8000/vendors/;
    }

    location /products/ {
        proxy_pass http://backend:8000/products/;
    }

    location /vendor-products/ {
        proxy_pass http://backend:8000/vendor-products/;
    }

    location /bulk-orders/ {
        proxy_pass http://backend:8000/bulk-orders/;
    }

    location /analytics/ {
        proxy_pass http://backend:8000/analytics/;
    }

    location /comparison/ {
        proxy_pass http://backend:8000/comparison/;
    }

    location /order-status/ {
        proxy_pass http://backend:8000/order-status/;
    }
}