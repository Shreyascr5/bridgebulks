services:
  postgres:
    image: postgres:15
    container_name: bridgebulks-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bridgebulks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: bridgebulks-backend
    restart: always
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: bridgebulks-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

  redis:
    image: redis:7
    container_name: bridgebulks-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: